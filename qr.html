<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vilasa CMMS • Portal QR de Campo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#f59e0b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Vilasa CMMS" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-900 border-2 border-amber-500 rounded-2xl p-5 shadow-2xl space-y-4">
    <!-- Cabeçalho da Máquina -->
    <div class="flex items-center justify-between border-b border-slate-800 pb-3">
      <div>
        <span class="text-[10px] font-black uppercase tracking-widest text-amber-400">VILASA CMMS • PORTAL QR CODE</span>
        <div class="flex items-center gap-2 mt-1">
          <span id="qrTagBadge" class="bg-amber-400 text-slate-950 font-black px-2.5 py-0.5 rounded text-sm">EQUIP</span>
          <h1 id="qrNomeEquip" class="text-sm font-extrabold text-white truncate">Carregando...</h1>
        </div>
      </div>
      <div class="text-right">
        <span class="text-[10px] text-slate-400 block">Leitura Atual</span>
        <strong id="qrHorimetroAtual" class="text-sm font-black text-emerald-400">0 H</strong>
      </div>
    </div>

    <!-- Abas: 1. Abrir OS | 2. Só Atualizar Horímetro -->
    <div id="qrAbasContainer" class="grid grid-cols-2 gap-2 bg-slate-950 p-1.5 rounded-xl border border-slate-800 text-xs font-black">
      <button id="btnAbaQROS" onclick="trocarAbaQR('os')" class="py-2 rounded-lg bg-amber-500 text-slate-950">
        🚨 Abrir OS / Reparo
      </button>
      <button id="btnAbaQRHor" onclick="trocarAbaQR('horimetro')" class="py-2 rounded-lg text-slate-400 hover:text-white">
        ⏱️ Diário Horímetro
      </button>
    </div>

    <!-- Identificação Rápida e Leitura Obrigatória -->
    <div class="space-y-3 text-xs">
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block font-black uppercase text-slate-400 mb-1">Sua Matrícula ou Nome</label>
          <input id="qrUsuarioInput" type="text" placeholder="Ex: JOAO / 2040"
            class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 font-bold uppercase text-white focus:border-amber-400 focus:outline-none" />
        </div>
        <div id="qrFuncaoWrapper">
          <label class="block font-black uppercase text-slate-400 mb-1">Sua Função</label>
          <select id="qrFuncaoSelect" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 font-bold text-amber-300 focus:border-amber-400 focus:outline-none">
            <option value="encarregado">👷 Encarregado / Oper.</option>
            <option value="mecanico">🔧 Mecânico (Já Assumir)</option>
          </select>
        </div>
      </div>

      <div>
        <label id="qrLabelHorimetro" class="block font-black uppercase text-amber-400 mb-1">Horímetro / KM Atual (Obrigatório)</label>
        <input id="qrHorimetroInput" type="number" step="0.1" placeholder="Digite a leitura exata do painel..."
          class="w-full bg-slate-950 border-2 border-amber-500 rounded-xl p-3 font-black text-base text-white focus:outline-none" />
      </div>

      <!-- Bloco Exclusivo de Abertura de OS (Sem GPS, Com Localização Escrita) -->
      <div id="blocoQROS" class="space-y-3">
        <div>
          <label class="block font-black uppercase text-slate-400 mb-1">Localização / Frente de Serviço</label>
          <input id="qrLocalizacaoInput" type="text" placeholder="Ex: TRECHO ESTACA 40, OFICINA, JAZIDA..."
            class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 font-bold uppercase text-white focus:border-amber-400 focus:outline-none" />
        </div>

        <div>
          <label class="block font-black uppercase text-slate-400 mb-1">Descrição do Problema / Defeito</label>
          <textarea id="qrProblemaInput" rows="3" placeholder="Descreva o problema da máquina..."
            class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 font-bold uppercase text-white focus:border-amber-400 focus:outline-none"></textarea>
        </div>

        <button onclick="enviarOSViaQRCode()" class="w-full py-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs uppercase shadow-lg">
          🚨 Confirmar Horímetro e Registrar OS
        </button>
      </div>

      <!-- Bloco Exclusivo de Diário de Horímetro -->
      <div id="blocoQRHorimetro" class="hidden space-y-3">
        <button onclick="enviarApenasHorimetroViaQRCode()" class="w-full py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xs uppercase shadow-lg">
          ✅ Salvar Leitura de Horímetro
        </button>
      </div>
    </div>

    <div id="qrAvisoPerfil" class="hidden p-3 rounded-xl text-[11px] font-bold text-center bg-slate-800 text-slate-300"></div>
    <div id="qrMensagemStatus" class="hidden p-3 rounded-xl text-xs font-bold text-center"></div>
    <div id="qrBadgeRede" class="text-center"></div>
  </div>

  <script src="config.js"></script>
  <script src="offline_sync.js"></script>
  <script>
    // ========================================================================
    // PORTAL QR - REGRAS DE ACESSO
    //  • SEM login (operadores): só LANÇA HORÍMETRO / KM.
    //  • COM login de equipe (mecânico, almoxarife, encarregado, PCM, engenheiro, admin): também ABRE OS.
    //  • Operador e gestor NÃO abrem OS por aqui.
    // Obs.: nesta etapa a regra vale na tela; o bloqueio definitivo no banco (RLS) vem na etapa de segurança.
    // ========================================================================
    const CARGOS_QUE_ABREM_OS = ['mecanico', 'almoxarife', 'encarregado', 'pcm', 'engenheiro', 'admin'];
    const LIMITE_SALTO_HORIMETRO = 300; // mesmo valor usado antes (H)
    const LIMITE_SALTO_KM = 5000;       // mesmo valor usado antes (KM)

    let equipAtualQR = { id: '', tag: '', nome: '', unidade_medida: 'H', horimetro_atual: 0, obra_id: null };
    let enviandoQR = false;

    // Mesmo papel do core.js (o portal não carrega o core): garante o cliente do banco.
    function obterClienteSupabase() {
      if (typeof db !== 'undefined' && db) return db;
      if (window.supabase && typeof SUPABASE_URL !== 'undefined') {
        try { db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); return db; } catch (e) {}
      }
      return null;
    }

    function lerSessaoLocal() {
      try { return JSON.parse(localStorage.getItem('vilasa_sessao_v2') || 'null'); } catch (e) { return null; }
    }
    function cargosDaSessao() {
      const s = lerSessaoLocal();
      return s && Array.isArray(s.cargos_lista) ? s.cargos_lista.map(c => String(c).toLowerCase().trim()) : [];
    }
    function podeAbrirOSNoQR() {
      return cargosDaSessao().some(c => CARGOS_QUE_ABREM_OS.includes(c));
    }

    function mostrarStatusQR(texto, tipo) {
      const box = document.getElementById('qrMensagemStatus');
      const cores = {
        ok: 'bg-emerald-500 text-slate-950',
        offline: 'bg-amber-400 text-slate-950',
        erro: 'bg-rose-600 text-white'
      };
      box.className = 'p-3 rounded-xl text-xs font-black text-center ' + (cores[tipo] || cores.ok);
      box.innerText = texto;
    }

    function trocarAbaQR(aba) {
      if (aba === 'os' && !podeAbrirOSNoQR()) aba = 'horimetro';
      const ehOS = aba === 'os';
      document.getElementById('blocoQROS').classList.toggle('hidden', !ehOS);
      document.getElementById('blocoQRHorimetro').classList.toggle('hidden', ehOS);
      document.getElementById('btnAbaQROS').className = ehOS
        ? 'py-2 rounded-lg bg-amber-500 text-slate-950 font-black'
        : 'py-2 rounded-lg text-slate-400 hover:text-white font-bold';
      document.getElementById('btnAbaQRHor').className = !ehOS
        ? 'py-2 rounded-lg bg-emerald-500 text-slate-950 font-black'
        : 'py-2 rounded-lg text-slate-400 hover:text-white font-bold';
    }

    function configurarTelaPorPerfil() {
      const sessao = lerSessaoLocal();
      const cargos = cargosDaSessao();
      const equipe = podeAbrirOSNoQR();
      const aviso = document.getElementById('qrAvisoPerfil');

      if (sessao) document.getElementById('qrUsuarioInput').value = sessao.nome || sessao.matricula || '';

      if (equipe) {
        document.getElementById('qrAbasContainer').classList.remove('hidden');
        const ehMecanico = cargos.includes('mecanico');
        document.getElementById('qrFuncaoWrapper').classList.toggle('hidden', !ehMecanico);
        document.getElementById('qrFuncaoSelect').value = ehMecanico ? 'mecanico' : 'encarregado';
        trocarAbaQR('os');
      } else {
        // Operador (ou sem login): somente horímetro.
        document.getElementById('qrAbasContainer').classList.add('hidden');
        document.getElementById('qrFuncaoWrapper').classList.add('hidden');
        trocarAbaQR('horimetro');
        aviso.innerHTML = 'Aqui você lança o <b>horímetro / KM</b>. Para abrir OS, a equipe de manutenção deve entrar no sistema com o login.';
        aviso.classList.remove('hidden');
      }
    }

    // ----- cache da última leitura (permite conferir o valor SEM internet) -----
    function chaveCacheEquip() { return 'vilasa_qr_equip_' + (equipAtualQR.id || equipAtualQR.tag); }
    function guardarCacheEquip() {
      try { localStorage.setItem(chaveCacheEquip(), JSON.stringify({
        id: equipAtualQR.id, tag: equipAtualQR.tag, nome: equipAtualQR.nome,
        unidade_medida: equipAtualQR.unidade_medida, horimetro_atual: equipAtualQR.horimetro_atual, obra_id: equipAtualQR.obra_id
      })); } catch (e) {}
    }

    // Retorna: { ok, semBase }  (semBase = não havia leitura anterior para comparar)
    function validarHorimetroDigitadoQR(valorStr) {
      const horNovo = parseFloat(valorStr);
      const un = (equipAtualQR.unidade_medida || 'H').toUpperCase();
      const horAtual = parseFloat(equipAtualQR.horimetro_atual || 0);

      if (isNaN(horNovo) || horNovo <= 0) {
        alert(`❌ HORÍMETRO INVÁLIDO!\nDigite a leitura atual de ${un} da máquina ${equipAtualQR.tag}.`);
        return { ok: false };
      }
      if (horAtual > 0 && horNovo < horAtual) {
        alert(`❌ BLOQUEADO: HORÍMETRO MENOR QUE O ATUAL!\n\n• Equipamento: ${equipAtualQR.tag}\n• Atual no Sistema: ${horAtual} ${un}\n• Você Digitou: ${horNovo} ${un}\n\nO valor não pode ser menor que ${horAtual} ${un}. Verifique o painel da máquina!`);
        return { ok: false };
      }
      const limiteSalto = un === 'KM' ? LIMITE_SALTO_KM : LIMITE_SALTO_HORIMETRO;
      if (horAtual > 0 && (horNovo - horAtual) > limiteSalto) {
        alert(`❌ BLOQUEADO: VALOR MUITO ACIMA DO NORMAL!\n\n• Equipamento: ${equipAtualQR.tag}\n• Último no Sistema: ${horAtual} ${un}\n• Você Digitou: ${horNovo} ${un}\n\nO horímetro subiu mais de ${limiteSalto} ${un} de uma só vez. Confira se não digitou um número a mais!`);
        return { ok: false };
      }
      return { ok: true, semBase: !(horAtual > 0) };
    }

    async function carregarEquipamentoDoQR() {
      configurarTelaPorPerfil();
      const params = new URLSearchParams(window.location.search);
      equipAtualQR.id = params.get('id') || '';
      equipAtualQR.tag = (params.get('tag') || 'EQUIP').toUpperCase();
      equipAtualQR.nome = (params.get('nome') || 'Equipamento').toUpperCase();
      equipAtualQR.unidade_medida = (params.get('un') || 'H').toUpperCase();

      // 1) Última leitura guardada neste celular (vale mesmo sem sinal)
      try {
        const salvo = JSON.parse(localStorage.getItem(chaveCacheEquip()) || 'null');
        if (salvo) equipAtualQR = { ...equipAtualQR, ...salvo };
      } catch (e) {}

      // 2) Leitura mais recente do servidor (quando houver sinal)
      const cliente = obterClienteSupabase();
      if (navigator.onLine && cliente) {
        try {
          const { data, error } = await cliente.rpc('qr_equipamento', { p_id: equipAtualQR.id || null, p_tag: equipAtualQR.id ? null : equipAtualQR.tag });
          if (!error && data) {
            equipAtualQR = { ...equipAtualQR, ...data };
            guardarCacheEquip();
          }
        } catch (e) {}
      }

      document.getElementById('qrTagBadge').innerText = equipAtualQR.tag;
      document.getElementById('qrNomeEquip').innerText = equipAtualQR.nome;
      atualizarTextoHorimetro();
      atualizarBadgeStatusRede();
    }

    function atualizarTextoHorimetro() {
      const un = equipAtualQR.unidade_medida || 'H';
      document.getElementById('qrHorimetroAtual').innerText = `${equipAtualQR.horimetro_atual || 0} ${un}`;
      document.getElementById('qrLabelHorimetro').innerText = `Horímetro / ${un} Atual (Mín: ${equipAtualQR.horimetro_atual || 0})`;
    }

    function confirmarSemBase(horNovo) {
      const un = equipAtualQR.unidade_medida || 'H';
      return confirm(`⚠️ Este celular ainda não tem a leitura anterior de ${equipAtualQR.tag} e não consegue conferir o valor.\n\nVocê confirma que a leitura do painel é ${horNovo} ${un}?`);
    }

    // Grava horímetro (diário + equipamento) pela fila segura. Devolve { ok, offline }.
    async function gravarLeituraHorimetro(horNovo, usuarioNome) {
      // Uma só chamada ao servidor: confere o salto, grava no diário e atualiza o equipamento.
      // Funciona sem login e é segura para reenvio (mesmo id nunca duplica).
      const r = await gravarDadosOfflineSafe('lancar_horimetro', 'RPC', {
        p_equipamento: equipAtualQR.id,
        p_leitura: horNovo,
        p_operador: usuarioNome,
        p_registrado_em: new Date().toISOString(),
        p_id: novoUuid()
      });
      if (r.error) return { ok: false };
      equipAtualQR.horimetro_atual = horNovo;
      guardarCacheEquip();
      atualizarTextoHorimetro();
      return { ok: true, offline: r.offline };
    }

    async function enviarOSViaQRCode() {
      if (enviandoQR) return;
      if (!podeAbrirOSNoQR()) return alert('Para abrir OS, entre no sistema com seu login (equipe de manutenção).');
      if (!equipAtualQR.id) return alert('Este QR não tem a identificação do equipamento. Peça ao PCM para reimprimir a etiqueta.');

      const usuarioNome = document.getElementById('qrUsuarioInput').value.trim().toUpperCase();
      const horStr = document.getElementById('qrHorimetroInput').value;
      const localizacao = document.getElementById('qrLocalizacaoInput').value.trim().toUpperCase();
      const problema = document.getElementById('qrProblemaInput').value.trim().toUpperCase();
      const funcaoSel = document.getElementById('qrFuncaoSelect').value;

      if (!usuarioNome) return alert('Informe sua Matrícula ou Nome!');
      const v = validarHorimetroDigitadoQR(horStr);
      if (!v.ok) return;
      if (!localizacao) return alert('Informe a Localização onde o equipamento está!');
      if (!problema) return alert('Descreva o problema do equipamento!');
      const horNovo = parseFloat(horStr);
      if (v.semBase && !navigator.onLine && !confirmarSemBase(horNovo)) return;

      // Só assume a OS se a pessoa realmente tem o cargo de mecânico no login.
      const ehMecanico = funcaoSel === 'mecanico' && cargosDaSessao().includes('mecanico');

      enviandoQR = true;
      try {
        const rOS = await gravarDadosOfflineSafe('ordens_servico', 'INSERT', {
          equipamento_id: equipAtualQR.id,
          obra_id: equipAtualQR.obra_id || null,
          status: ehMecanico ? 'em_execucao' : 'aberta',
          motivo_rep: 'CORRETIVA',
          local_manutencao_pcm: localizacao,
          descricao_problema: problema,
          mecanico_nome: ehMecanico ? usuarioNome : '',
          horimetro_os: horNovo,
          aberta_em: new Date().toISOString()
        });
        if (rOS.error) return mostrarStatusQR('❌ A OS NÃO foi registrada. Tente novamente.', 'erro');

        const rHor = await gravarLeituraHorimetro(horNovo, usuarioNome);
        document.getElementById('qrProblemaInput').value = '';
        const offline = rOS.offline || rHor.offline;
        if (offline) {
          mostrarStatusQR('📲 SEM SINAL: a OS ficou SALVA NO CELULAR e será enviada sozinha quando voltar o sinal. Mantenha este celular com o site instalado.', 'offline');
        } else {
          mostrarStatusQR(ehMecanico ? `✅ OS aberta e JÁ EM ATENDIMENTO no nome de ${usuarioNome}!` : '✅ OS aberta com sucesso! Equipe de mecânicos notificada.', 'ok');
        }
      } finally {
        enviandoQR = false;
        atualizarBadgeStatusRede();
      }
    }

    async function enviarApenasHorimetroViaQRCode() {
      if (enviandoQR) return;
      if (!equipAtualQR.id) return alert('Este QR não tem a identificação do equipamento. Peça ao PCM para reimprimir a etiqueta.');
      const usuarioNome = document.getElementById('qrUsuarioInput').value.trim().toUpperCase();
      const horStr = document.getElementById('qrHorimetroInput').value;

      if (!usuarioNome) return alert('Informe sua Matrícula ou Nome!');
      const v = validarHorimetroDigitadoQR(horStr);
      if (!v.ok) return;
      const horNovo = parseFloat(horStr);
      if (v.semBase && !navigator.onLine && !confirmarSemBase(horNovo)) return;

      enviandoQR = true;
      try {
        const r = await gravarLeituraHorimetro(horNovo, usuarioNome);
        if (!r.ok) return mostrarStatusQR('❌ A leitura NÃO foi registrada. Tente novamente.', 'erro');
        document.getElementById('qrHorimetroInput').value = '';
        const un = equipAtualQR.unidade_medida || 'H';
        if (r.offline) {
          mostrarStatusQR(`📲 SEM SINAL: leitura de ${horNovo} ${un} SALVA NO CELULAR. Será enviada sozinha quando voltar o sinal.`, 'offline');
        } else {
          mostrarStatusQR(`✅ Horímetro atualizado para ${horNovo} ${un}!`, 'ok');
        }
      } finally {
        enviandoQR = false;
        atualizarBadgeStatusRede();
      }
    }

    document.addEventListener('DOMContentLoaded', carregarEquipamentoDoQR);
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW:', e)));
    }
  </script>
</body>
</html>
