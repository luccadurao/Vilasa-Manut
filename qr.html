<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vilasa CMMS • Portal QR de Campo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-900 border-2 border-amber-500 rounded-2xl p-5 shadow-2xl space-y-4">
    <!-- Cabeçalho da Máquina -->
    <div class="flex items-center justify-between border-b border-slate-800 pb-3">
      <div>
        <span class="text-[10px] font-black uppercase tracking-widest text-amber-400">VILASA CMMS • PORTAL QR CODE</span>
        <div class="flex items-center gap-2 mt-1">
          <span id="qrTagBadge" class="bg-amber-400 text-slate-950 font-black px-2.5 py-0.5 rounded text-sm">EQUIP</span>
          <h1 id="qrNomeEquip" class="text-sm font-extrabold text-white truncate">Carregando...</h1>
        </div>
      </div>
      <div class="text-right">
        <span class="text-[10px] text-slate-400 block">Leitura Atual</span>
        <strong id="qrHorimetroAtual" class="text-sm font-black text-emerald-400">0 H</strong>
      </div>
    </div>

    <!-- Abas: 1. Abrir OS | 2. Só Atualizar Horímetro -->
    <div class="grid grid-cols-2 gap-2 bg-slate-950 p-1.5 rounded-xl border border-slate-800 text-xs font-black">
      <button id="btnAbaQROS" onclick="trocarAbaQR('os')" class="py-2 rounded-lg bg-amber-500 text-slate-950">
        🚨 Abrir OS / Reparo
      </button>
      <button id="btnAbaQRHor" onclick="trocarAbaQR('horimetro')" class="py-2 rounded-lg text-slate-400 hover:text-white">
        ⏱️ Diário Horímetro
      </button>
    </div>

    <!-- Identificação Rápida e Leitura Obrigatória -->
    <div class="space-y-3 text-xs">
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block font-black uppercase text-slate-400 mb-1">Sua Matrícula ou Nome</label>
          <input id="qrUsuarioInput" type="text" placeholder="Ex: JOAO / 2040"
            class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 font-bold uppercase text-white focus:border-amber-400 focus:outline-none" />
        </div>
        <div>
          <label class="block font-black uppercase text-slate-400 mb-1">Sua Função</label>
          <select id="qrFuncaoSelect" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 font-bold text-amber-300 focus:border-amber-400 focus:outline-none">
            <option value="encarregado">👷 Encarregado / Oper.</option>
            <option value="mecanico">🔧 Mecânico (Já Assumir)</option>
          </select>
        </div>
      </div>

      <div>
        <label id="qrLabelHorimetro" class="block font-black uppercase text-amber-400 mb-1">Horímetro / KM Atual (Obrigatório)</label>
        <input id="qrHorimetroInput" type="number" step="0.1" placeholder="Digite a leitura exata do painel..."
          class="w-full bg-slate-950 border-2 border-amber-500 rounded-xl p-3 font-black text-base text-white focus:outline-none" />
      </div>

      <!-- Bloco Exclusivo de Abertura de OS (Sem GPS, Com Localização Escrita) -->
      <div id="blocoQROS" class="space-y-3">
        <div>
          <label class="block font-black uppercase text-slate-400 mb-1">Localização / Frente de Serviço</label>
          <input id="qrLocalizacaoInput" type="text" placeholder="Ex: TRECHO ESTACA 40, OFICINA, JAZIDA..."
            class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 font-bold uppercase text-white focus:border-amber-400 focus:outline-none" />
        </div>

        <div>
          <label class="block font-black uppercase text-slate-400 mb-1">Descrição do Problema / Defeito</label>
          <textarea id="qrProblemaInput" rows="3" placeholder="Descreva o problema da máquina..."
            class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 font-bold uppercase text-white focus:border-amber-400 focus:outline-none"></textarea>
        </div>

        <button onclick="enviarOSViaQRCode()" class="w-full py-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs uppercase shadow-lg">
          🚨 Confirmar Horímetro e Registrar OS
        </button>
      </div>

      <!-- Bloco Exclusivo de Diário de Horímetro -->
      <div id="blocoQRHorimetro" class="hidden space-y-3">
        <button onclick="enviarApenasHorimetroViaQRCode()" class="w-full py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xs uppercase shadow-lg">
          ✅ Salvar Leitura de Horímetro
        </button>
      </div>
    </div>

    <div id="qrMensagemStatus" class="hidden p-3 rounded-xl text-xs font-bold text-center"></div>
  </div>

  <script src="config.js"></script>
  <script src="offline_sync.js"></script>
  <script>
    let dbQR = null;
    let equipAtualQR = {
      id: '',
      tag: '',
      nome: '',
      unidade_medida: 'H',
      horimetro_atual: 0,
      obra_id: null
    };

    function inicializarClienteQR() {
      if (typeof db !== 'undefined' && db) return (dbQR = db);
      if (typeof window.supabase !== 'undefined' && typeof SUPABASE_URL !== 'undefined' && typeof SUPABASE_KEY !== 'undefined') {
        dbQR = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
      return dbQR;
    }

    function trocarAbaQR(aba) {
      const ehOS = aba === 'os';
      document.getElementById('blocoQROS').classList.toggle('hidden', !ehOS);
      document.getElementById('blocoQRHorimetro').classList.toggle('hidden', ehOS);
      document.getElementById('btnAbaQROS').className = ehOS
        ? 'py-2 rounded-lg bg-amber-500 text-slate-950 font-black'
        : 'py-2 rounded-lg text-slate-400 hover:text-white font-bold';
      document.getElementById('btnAbaQRHor').className = !ehOS
        ? 'py-2 rounded-lg bg-emerald-500 text-slate-950 font-black'
        : 'py-2 rounded-lg text-slate-400 hover:text-white font-bold';
    }

    // Valida estritamente se o horímetro digitado não é menor que o atual nem um salto absurdo
    function validarHorimetroDigitadoQR(valorStr) {
      const horNovo = parseFloat(valorStr);
      const un = (equipAtualQR.unidade_medida || 'H').toUpperCase();
      const horAtual = parseFloat(equipAtualQR.horimetro_atual || 0);

      if (isNaN(horNovo) || horNovo <= 0) {
        alert(`❌ HORÍMETRO INVÁLIDO!\nDigite a leitura atual de ${un} da máquina ${equipAtualQR.tag}.`);
        return false;
      }

      if (horAtual > 0 && horNovo < horAtual) {
        alert(
          `❌ BLOQUEADO: HORÍMETRO MENOR QUE O ATUAL!\n\n` +
          `• Equipamento: ${equipAtualQR.tag}\n` +
          `• Atual no Sistema: ${horAtual} ${un}\n` +
          `• Você Digitou: ${horNovo} ${un}\n\n` +
          `O valor não pode ser menor que ${horAtual} ${un}. Verifique o painel da máquina!`
        );
        return false;
      }

      const limiteSalto = un === 'KM' ? 5000 : 300;
      if (horAtual > 0 && (horNovo - horAtual) > limiteSalto) {
        alert(
          `❌ BLOQUEADO: VALOR MUITO ACIMA DO NORMAL!\n\n` +
          `• Equipamento: ${equipAtualQR.tag}\n` +
          `• Último no Sistema: ${horAtual} ${un}\n` +
          `• Você Digitou: ${horNovo} ${un}\n\n` +
          `O horímetro subiu mais de ${limiteSalto} ${un} de uma só vez. Confira se não digitou um número a mais!`
        );
        return false;
      }

      return true;
    }

    async function carregarEquipamentoDoQR() {
      inicializarClienteQR();
      const params = new URLSearchParams(window.location.search);
      equipAtualQR.id = params.get('id') || '';
      equipAtualQR.tag = (params.get('tag') || 'EQUIP').toUpperCase();
      equipAtualQR.nome = (params.get('nome') || 'Equipamento').toUpperCase();
      equipAtualQR.unidade_medida = (params.get('un') || 'H').toUpperCase();

      // Se o usuário já estiver logado no aparelho, pré-preenche nome e função (Mecânico ou Encarregado)
      try {
        const sessao = JSON.parse(localStorage.getItem('vilasa_sessao_v2') || 'null');
        if (sessao) {
          document.getElementById('qrUsuarioInput').value = sessao.nome || sessao.matricula || '';
          const cargos = Array.isArray(sessao.cargos_lista) ? sessao.cargos_lista.map(c => String(c).toLowerCase()) : [];
          if (cargos.includes('mecanico')) {
            document.getElementById('qrFuncaoSelect').value = 'mecanico';
          }
        }
      } catch (e) {}

      // Busca o horímetro mais recente no Supabase
      if (navigator.onLine && dbQR) {
        try {
          let query = dbQR.from('equipamentos').select('*');
          if (equipAtualQR.id) query = query.eq('id', equipAtualQR.id);
          else query = query.eq('tag', equipAtualQR.tag);
          const { data } = await query.maybeSingle();
          if (data) {
            equipAtualQR = data;
          }
        } catch (e) {}
      }

      document.getElementById('qrTagBadge').innerText = equipAtualQR.tag;
      document.getElementById('qrNomeEquip').innerText = equipAtualQR.nome;
      document.getElementById('qrHorimetroAtual').innerText = `${equipAtualQR.horimetro_atual || 0} ${equipAtualQR.unidade_medida || 'H'}`;
      document.getElementById('qrLabelHorimetro').innerText = `Horímetro / ${equipAtualQR.unidade_medida || 'H'} Atual (Mín: ${equipAtualQR.horimetro_atual || 0})`;
    }

    async function verificarSeUsuarioEhMecanicoNoBanco(textoUsuario, funcaoSelecionada) {
      if (funcaoSelecionada === 'mecanico') return true;
      if (!navigator.onLine || !dbQR || !textoUsuario) return false;
      try {
        const limpo = textoUsuario.trim().toLowerCase();
        const { data } = await dbQR.from('perfis_usuarios').select('*');
        const achou = (data || []).find(u =>
          u.ativo !== false &&
          (String(u.matricula || '').toLowerCase() === limpo || String(u.nome || '').toLowerCase() === limpo)
        );
        if (achou && Array.isArray(achou.cargos_lista)) {
          return achou.cargos_lista.map(c => String(c).toLowerCase()).includes('mecanico');
        }
      } catch (e) {}
      return false;
    }

    async function enviarOSViaQRCode() {
      const usuarioNome = document.getElementById('qrUsuarioInput').value.trim().toUpperCase();
      const funcaoSel = document.getElementById('qrFuncaoSelect').value;
      const horStr = document.getElementById('qrHorimetroInput').value;
      const localizacao = document.getElementById('qrLocalizacaoInput').value.trim().toUpperCase();
      const problema = document.getElementById('qrProblemaInput').value.trim().toUpperCase();

      if (!usuarioNome) return alert('Informe sua Matrícula ou Nome!');
      if (!validarHorimetroDigitadoQR(horStr)) return;
      if (!localizacao) return alert('Informe a Localização onde o equipamento está!');
      if (!problema) return alert('Descreva o problema do equipamento!');

      const horNovo = parseFloat(horStr);
      const ehMecanico = await verificarSeUsuarioEhMecanicoNoBanco(usuarioNome, funcaoSel);

      const payloadOS = {
        equipamento_id: equipAtualQR.id,
        obra_id: equipAtualQR.obra_id || null,
        status: ehMecanico ? 'em_execucao' : 'aberta',
        motivo_rep: 'CORRETIVA',
        local_manutencao_pcm: localizacao,
        descricao_problema: problema,
        mecanico_nome: ehMecanico ? usuarioNome : '',
        horimetro_os: horNovo,
        aberta_em: new Date().toISOString()
      };

      try {
        if (navigator.onLine && dbQR) {
          const { error } = await dbQR.from('ordens_servico').insert([payloadOS]);
          if (error) throw error;
          await dbQR.from('equipamentos').update({ horimetro_atual: horNovo }).eq('id', equipAtualQR.id);
          await dbQR.from('diario_horimetro').insert([{
            equipamento_id: equipAtualQR.id,
            leitura: horNovo,
            operador_nome: usuarioNome,
            registrado_em: new Date().toISOString()
          }]);
        } else if (typeof enfileirarOperacaoOffline === 'function') {
          enfileirarOperacaoOffline('ordens_servico', 'INSERT', payloadOS);
          enfileirarOperacaoOffline('equipamentos', 'UPDATE', { horimetro_atual: horNovo }, equipAtualQR.id);
        }

        equipAtualQR.horimetro_atual = horNovo;
        document.getElementById('qrHorimetroAtual').innerText = `${horNovo} ${equipAtualQR.unidade_medida || 'H'}`;
        document.getElementById('qrProblemaInput').value = '';

        const box = document.getElementById('qrMensagemStatus');
        box.className = 'p-3 rounded-xl text-xs font-black text-center bg-emerald-500 text-slate-950';
        box.innerText = ehMecanico
          ? `✅ OS aberta e JÁ EM ATENDIMENTO no nome do mecânico ${usuarioNome}!`
          : `✅ OS aberta com sucesso! Equipe de mecânicos notificada.`;
        box.classList.remove('hidden');
      } catch (err) {
        alert('Erro ao registrar OS: ' + (err.message || err));
      }
    }

    async function enviarApenasHorimetroViaQRCode() {
      const usuarioNome = document.getElementById('qrUsuarioInput').value.trim().toUpperCase();
      const horStr = document.getElementById('qrHorimetroInput').value;

      if (!usuarioNome) return alert('Informe sua Matrícula ou Nome!');
      if (!validarHorimetroDigitadoQR(horStr)) return;

      const horNovo = parseFloat(horStr);
      try {
        if (navigator.onLine && dbQR) {
          await dbQR.from('equipamentos').update({ horimetro_atual: horNovo }).eq('id', equipAtualQR.id);
          await dbQR.from('diario_horimetro').insert([{
            equipamento_id: equipAtualQR.id,
            leitura: horNovo,
            operador_nome: usuarioNome,
            registrado_em: new Date().toISOString()
          }]);
        }
        equipAtualQR.horimetro_atual = horNovo;
        document.getElementById('qrHorimetroAtual').innerText = `${horNovo} ${equipAtualQR.unidade_medida || 'H'}`;

        const box = document.getElementById('qrMensagemStatus');
        box.className = 'p-3 rounded-xl text-xs font-black text-center bg-emerald-500 text-slate-950';
        box.innerText = `✅ Horímetro atualizado para ${horNovo} ${equipAtualQR.unidade_medida || 'H'}!`;
        box.classList.remove('hidden');
      } catch (err) {
        alert('Erro ao salvar horímetro: ' + (err.message || err));
      }
    }

    document.addEventListener('DOMContentLoaded', carregarEquipamentoDoQR);
  </script>
</body>
</html>
