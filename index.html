<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vilasa - Gestão de Manutenção (CMMS V2)</title>
  <link rel="stylesheet" href="vendor/tailwind.css" />
  <link rel="stylesheet" href="vendor/fa/css/all.min.css" />
  <script src="vendor/supabase.js"></script>
  <!-- Biblioteca para gerar o PNG Executivo de 1 Página -->
  <script src="vendor/html2canvas.min.js"></script>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#f59e0b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Vilasa CMMS" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen font-sans">

  <!-- 1. TELA DE LOGIN -->
  <div id="telaLogin" class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
    <div class="bg-white border border-slate-200 rounded-2xl p-6 max-w-md w-full shadow-xl space-y-5">
      <div class="text-center">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-amber-500 text-slate-950 font-black text-2xl mb-2 shadow-md">
          <i class="fa-solid fa-screwdriver-wrench"></i>
        </div>
        <h1 class="text-xl font-black text-slate-900 tracking-wide">VILASA <span class="text-amber-500">CMMS</span></h1>
        <p class="text-xs text-slate-500 font-semibold mt-1">Engenharia de Manutenção, Controle de Frota & PCM</p>
      </div>

      <form onsubmit="realizarLogin(event)" class="space-y-4">
        <div>
          <label class="block text-[11px] font-black uppercase text-slate-600 mb-1">Matrícula / Usuário</label>
          <input id="loginMatricula" type="text" required autocapitalize="none" autocorrect="off" spellcheck="false"
            placeholder="Digite seu usuário ou matrícula..."
            class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-sm font-bold text-slate-900 placeholder-slate-400 focus:outline-none focus:border-amber-500 focus:bg-white" />
        </div>
        <div>
          <label class="block text-[11px] font-black uppercase text-slate-600 mb-1">Senha</label>
          <input id="loginSenha" type="password" required autocapitalize="none" autocorrect="off" spellcheck="false"
            placeholder="••••••"
            class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-sm font-bold text-slate-900 placeholder-slate-400 focus:outline-none focus:border-amber-500 focus:bg-white" />
        </div>
        <button type="submit" class="w-full py-3.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs uppercase tracking-wider shadow-md transition">
          🔑 Entrar no Sistema
        </button>
      </form>
    </div>
  </div>

  <!-- 2. APLICAÇÃO PRINCIPAL -->
  <div id="appPrincipal" class="hidden min-h-screen flex flex-col lg:flex-row bg-slate-50">

    <!-- MENU LATERAL CLARO -->
    <aside class="w-full lg:w-64 bg-white text-slate-800 p-4 flex flex-col justify-between shrink-0 border-b lg:border-b-0 lg:border-r border-slate-200 shadow-sm">
      <div class="space-y-4">
        <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200">
          <div class="flex items-center justify-between">
            <span class="text-sm font-black text-slate-900 tracking-wide">VILASA <span class="text-amber-500">CMMS</span></span>
            <button onclick="encerrarSessao()" class="text-xs text-rose-600 hover:text-rose-700 font-extrabold" title="Sair">
              <i class="fa-solid fa-right-from-bracket"></i> Sair
            </button>
          </div>
          <div class="mt-2 pt-2 border-t border-slate-200">
            <div id="headerNomeUsuario" class="text-xs font-black text-slate-900 truncate">Usuário</div>
            <div id="headerCargoUsuario" class="text-[10px] font-bold text-slate-500 truncate">Cargo</div>
          </div>
        </div>

        <nav class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-1 gap-1.5">
          <button id="nav-os" onclick="navegarPara('os')" class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-bold text-slate-700 hover:bg-slate-100 flex items-center gap-2.5 transition">
            <i class="fa-solid fa-wrench w-4 text-center"></i>
            <span>Ordens & REP</span>
          </button>
          <button id="nav-frota" onclick="navegarPara('frota')" class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-bold text-slate-700 hover:bg-slate-100 flex items-center gap-2.5 transition">
            <i class="fa-solid fa-truck-monster w-4 text-center"></i>
            <span>Frota & QR Codes</span>
          </button>
          <button id="nav-preventivas" onclick="navegarPara('preventivas')" class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-bold text-slate-700 hover:bg-slate-100 flex items-center gap-2.5 transition">
            <i class="fa-solid fa-calendar-check w-4 text-center"></i>
            <span>Preventivas (SAP)</span>
          </button>
          <button id="nav-estoque" onclick="navegarPara('estoque')" class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-bold text-slate-700 hover:bg-slate-100 flex items-center gap-2.5 transition">
            <i class="fa-solid fa-boxes-stacked w-4 text-center"></i>
            <span>Almoxarifado</span>
          </button>
          <button id="nav-diesel" onclick="navegarPara('diesel')" class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-bold text-slate-700 hover:bg-slate-100 flex items-center gap-2.5 transition">
            <i class="fa-solid fa-gas-pump w-4 text-center"></i>
            <span>Diesel</span>
          </button>
          <button id="nav-kpis" onclick="navegarPara('kpis')" class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-bold text-slate-700 hover:bg-slate-100 flex items-center gap-2.5 transition">
            <i class="fa-solid fa-chart-line w-4 text-center"></i>
            <span>Indicadores (KPIs)</span>
          </button>
          <button id="nav-admin" onclick="navegarPara('admin')" class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-bold text-slate-700 hover:bg-slate-100 flex items-center gap-2.5 transition">
            <i class="fa-solid fa-user-shield w-4 text-center"></i>
            <span>Administração</span>
          </button>
        </nav>
      </div>
    </aside>

    <!-- ÁREA DE CONTEÚDO PRINCIPAL -->
    <main class="flex-1 p-4 lg:p-6 overflow-y-auto space-y-4">

      <!-- BARRA UNIVERSAL DE EXPORTAÇÃO (APARECE EM TODAS AS ABAS RESPEITANDO O FILTRO ATUAL) -->
      <div id="barraExportacaoUniversal" class="bg-white border border-slate-200 rounded-2xl p-3 shadow-sm flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
          <span id="tituloAbaExportacaoUniversal" class="text-xs font-black uppercase text-slate-800">Central de Relatórios da Aba Atual</span>
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <button onclick="acionarExportacaoUniversalCSV()" class="px-3 py-1.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xs shadow-sm flex items-center gap-1.5">
            <i class="fa-solid fa-file-excel"></i>
            <span>Exportar Planilha (CSV)</span>
          </button>
          <button onclick="gerarRelatorioCompletoPDF()" class="px-3 py-1.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-black text-xs shadow-sm flex items-center gap-1.5">
            <i class="fa-solid fa-file-pdf"></i>
            <span>Relatório Completo (PDF Filtrado)</span>
          </button>
          <button onclick="gerarRelatorioCompletoPDF()" class="px-3.5 py-1.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-black text-xs shadow flex items-center gap-1.5">
            <i class="fa-solid fa-print"></i>
            <span>🖨️ Imprimir Relatório (Filtrado)</span>
          </button>
        </div>
      </div>

      <!-- SEÇÃO 1: ORDENS DE SERVIÇO + QUADRO REP -->
      <section id="sec-os" class="space-y-5">
        <div class="bg-white rounded-2xl border-2 border-amber-500 p-4 shadow-sm">
          <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-200 pb-3 mb-3">
            <div>
              <span class="text-[10px] font-black uppercase tracking-widest text-amber-600">RELATÓRIO DE EQUIPAMENTOS PARADOS (REP)</span>
              <h3 class="text-base font-black text-slate-900">Quadro Geral de Indisponibilidade em Tempo Real</h3>
            </div>
            <div class="text-right">
              <span id="contadorParadosCabecalhoREP" class="inline-block bg-rose-600 text-white text-xs font-black px-3 py-1 rounded-lg">0 Parado(s)</span>
              <div id="dataHoraCabecalhoREP" class="text-[10px] font-bold text-slate-400 mt-0.5"></div>
            </div>
          </div>
          <div id="tabelaEnxutaParadosREP" class="overflow-x-auto"></div>
        </div>

        <div id="listaOrdensServico" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></div>
      </section>

      <!-- SEÇÃO 2: FROTA -->
      <section id="sec-frota" class="hidden"></section>

      <!-- SEÇÃO 3: PREVENTIVAS (SAP PM) -->
      <section id="sec-preventivas" class="hidden"></section>

      <!-- SEÇÃO 4: ALMOXARIFADO -->
      <section id="sec-estoque" class="hidden"></section>

      <!-- SEÇÃO 5: INDICADORES (KPIS) -->
      <section id="sec-diesel" class="hidden"></section>
      <section id="sec-kpis" class="hidden"></section>

      <!-- SEÇÃO 6: ADMINISTRAÇÃO -->
      <section id="sec-admin" class="hidden"></section>

    </main>
  </div>

  <!-- 3. SCRIPTS DA ARQUITETURA MODULAR V2 -->
  <script src="config.js"></script>
  <script src="core.js"></script>
  <script src="offline_sync.js"></script>
  <script src="os_rep.js"></script>
  <script src="pcm_sap.js"></script>
  <script src="frota.js"></script>
  <script src="estoque.js"></script>
  <script src="kpis.js"></script>
  <script src="vendor/xlsx.mini.min.js"></script>
  <script src="diesel.js"></script>
  <script src="admin.js"></script>
  <script>
    // Instala o "modo offline": guarda o site no celular para abrir sem internet.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW:', e)));
    }
  </script>
</body>
</html>
