<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vilasa - Gestão de Manutenção (CMMS V2)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen font-sans">

  <!-- 1. TELA DE LOGIN -->
  <div id="telaLogin" class="min-h-screen bg-slate-950 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-md w-full shadow-2xl space-y-5">
      <div class="text-center">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-amber-500 text-slate-950 font-black text-2xl mb-2 shadow-lg">
          <i class="fa-solid fa-screwdriver-wrench"></i>
        </div>
        <h1 class="text-xl font-black text-white tracking-wide">VILASA <span class="text-amber-400">CMMS</span></h1>
        <p class="text-xs text-slate-400 mt-1">Engenharia de Manutenção, Controle de Frota & PCM</p>
      </div>

      <form onsubmit="realizarLogin(event)" class="space-y-4">
        <div>
          <label class="block text-[11px] font-black uppercase text-slate-400 mb-1">Matrícula</label>
          <input id="loginMatricula" type="text" required placeholder="Digite sua matrícula..."
            class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm font-bold text-white uppercase focus:outline-none focus:border-amber-400" />
        </div>
        <div>
          <label class="block text-[11px] font-black uppercase text-slate-400 mb-1">Senha</label>
          <input id="loginSenha" type="password" required placeholder="••••••"
            class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm font-bold text-white focus:outline-none focus:border-amber-400" />
        </div>
        <button type="submit" class="w-full py-3.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs uppercase tracking-wider shadow-lg transition">
          🔑 Entrar no Sistema
        </button>
      </form>
    </div>
  </div>

  <!-- 2. APLICAÇÃO PRINCIPAL (OCULTA ATÉ O LOGIN) -->
  <div id="appPrincipal" class="hidden min-h-screen flex flex-col lg:flex-row">

    <!-- MENU LATERAL / TOPO -->
    <aside class="w-full lg:w-64 bg-slate-950 text-white p-4 flex flex-col justify-between shrink-0 border-b lg:border-b-0 lg:border-r border-slate-800">
      <div class="space-y-4">
        <!-- Logo e Usuário Logado -->
        <div class="bg-slate-900 p-3.5 rounded-xl border border-slate-800">
          <div class="flex items-center justify-between">
            <span class="text-sm font-black text-amber-400 tracking-wide">VILASA CMMS</span>
            <button onclick="encerrarSessao()" class="text-xs text-rose-400 hover:text-rose-300 font-bold" title="Sair">
              <i class="fa-solid fa-right-from-bracket"></i> Sair
            </button>
          </div>
          <div class="mt-2 pt-2 border-t border-slate-800">
            <div id="headerNomeUsuario" class="text-xs font-black text-white truncate">Usuário</div>
            <div id="headerCargoUsuario" class="text-[10px] font-bold text-slate-400 truncate">Cargo</div>
          </div>
          <!-- Aqui o core.js e o offline_sync.js injetam automaticamente o Seletor de Obra e o Status Offline -->
        </div>

        <!-- Botões de Navegação entre Módulos -->
        <nav class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-1 gap-1.5">
          <button id="nav-os" onclick="navegarPara('os')" class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-bold text-slate-300 hover:bg-slate-900 flex items-center gap-2.5 transition">
            <i class="fa-solid fa-wrench w-4 text-center"></i>
            <span>Ordens & REP</span>
          </button>
          <button id="nav-frota" onclick="navegarPara('frota')" class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-bold text-slate-300 hover:bg-slate-900 flex items-center gap-2.5 transition">
            <i class="fa-solid fa-truck-monster w-4 text-center"></i>
            <span>Frota & QR Codes</span>
          </button>
          <button id="nav-preventivas" onclick="navegarPara('preventivas')" class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-bold text-slate-300 hover:bg-slate-900 flex items-center gap-2.5 transition">
            <i class="fa-solid fa-calendar-check w-4 text-center"></i>
            <span>Preventivas (SAP)</span>
          </button>
          <button id="nav-estoque" onclick="navegarPara('estoque')" class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-bold text-slate-300 hover:bg-slate-900 flex items-center gap-2.5 transition">
            <i class="fa-solid fa-boxes-stacked w-4 text-center"></i>
            <span>Almoxarifado</span>
          </button>
          <button id="nav-kpis" onclick="navegarPara('kpis')" class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-bold text-slate-300 hover:bg-slate-900 flex items-center gap-2.5 transition">
            <i class="fa-solid fa-chart-line w-4 text-center"></i>
            <span>Indicadores (KPIs)</span>
          </button>
          <button id="nav-admin" onclick="navegarPara('admin')" class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-bold text-slate-300 hover:bg-slate-900 flex items-center gap-2.5 transition">
            <i class="fa-solid fa-user-shield w-4 text-center"></i>
            <span>Administração</span>
          </button>
        </nav>
      </div>
    </aside>

    <!-- ÁREA DE CONTEÚDO PRINCIPAL -->
    <main class="flex-1 p-4 lg:p-6 overflow-y-auto space-y-6">

      <!-- SEÇÃO 1: ORDENS DE SERVIÇO + QUADRO REP -->
      <section id="sec-os" class="space-y-5">
        <!-- Quadro Enxuto de Equipamentos Parados (REP) -->
        <div class="bg-white rounded-2xl border-2 border-amber-500 p-4 shadow-sm">
          <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-200 pb-3 mb-3">
            <div>
              <span class="text-[10px] font-black uppercase tracking-widest text-amber-600">RELATÓRIO DE EQUIPAMENTOS PARADOS (REP)</span>
              <h3 class="text-base font-black text-slate-900">Quadro Geral de Indisponibilidade em Tempo Real</h3>
            </div>
            <div class="text-right">
              <span id="contadorParadosCabecalhoREP" class="inline-block bg-rose-600 text-white text-xs font-black px-3 py-1 rounded-lg">0 Parado(s)</span>
              <div id="dataHoraCabecalhoREP" class="text-[10px] font-bold text-slate-400 mt-0.5"></div>
            </div>
          </div>
          <div id="tabelaEnxutaParadosREP" class="overflow-x-auto"></div>
        </div>

        <!-- Lista de Cards de Ordens de Serviço -->
        <div id="listaOrdensServico" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></div>
      </section>

      <!-- SEÇÃO 2: FROTA -->
      <section id="sec-frota" class="hidden"></section>

      <!-- SEÇÃO 3: PREVENTIVAS (SAP PM) -->
      <section id="sec-preventivas" class="hidden"></section>

      <!-- SEÇÃO 4: ALMOXARIFADO (OS 3 BOTÕES) -->
      <section id="sec-estoque" class="hidden"></section>

      <!-- SEÇÃO 5: INDICADORES (KPIS) -->
      <section id="sec-kpis" class="hidden"></section>

      <!-- SEÇÃO 6: ADMINISTRAÇÃO & MODO DEUS -->
      <section id="sec-admin" class="hidden"></section>

    </main>
  </div>

  <!-- 3. SCRIPTS DA ARQUITETURA MODULAR V2 -->
  <script src="config.js"></script>
  <script src="core.js"></script>
  <script src="offline_sync.js"></script>
  <script src="os_rep.js"></script>
  <script src="uber_mecanicos.js"></script>
  <script src="pcm_sap.js"></script>
  <script src="frota.js"></script>
  <script src="estoque.js"></script>
  <script src="kpis.js"></script>
  <script src="admin.js"></script>
</body>
</html>
