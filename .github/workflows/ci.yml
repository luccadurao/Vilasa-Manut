name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ferramentas/package-lock.json
      - run: npm ci
        working-directory: ferramentas
      - run: node scripts/validar-manifestos.js
      - run: node --test test/*.test.js
      - run: npm run types --prefix ferramentas

  # Aplica todas as migrações num Postgres 17 vazio (a versão do Supabase),
  # roda os testes SQL, confere idempotência, permissões e reversão.
  # Não fala com nenhum projeto Supabase.
  banco:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/testar-sql-local.sh
